name: test-and-deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - uses: actions/upload-artifact@v4
        with:
          name: headerdial-extension
          path: dist/headerdial-[0-9]*.zip
  firefox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: firefox --version
      - run: node scripts/build.js && node test/e2e-firefox.js
      - uses: actions/upload-artifact@v4
        with:
          name: headerdial-firefox
          path: dist/headerdial-firefox-*.zip
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [test, firefox]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
